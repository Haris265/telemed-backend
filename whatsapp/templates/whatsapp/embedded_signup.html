<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect WhatsApp</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        color: #102033;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        background: #fff;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 10px 30px rgba(16, 32, 51, 0.08);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #5b6b7c;
        line-height: 1.45;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 1rem;
        font-weight: 600;
        background: #25d366;
        color: #06351a;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .status {
        margin-top: 16px;
        font-size: 0.9rem;
        color: #5b6b7c;
        min-height: 1.2em;
      }
      .error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Connect WhatsApp Business</h1>
      <p>
        Link your WhatsApp Business number so patients can book and receive visit
        updates on WhatsApp.
      </p>
      <button id="connectBtn" type="button">Continue with Meta</button>
      <div id="status" class="status"></div>
    </div>

    <script>
      const APP_ID = "{{ app_id|escapejs }}";
      const CONFIG_ID = "{{ config_id|escapejs }}";
      const STATE = "{{ state|escapejs }}";
      const REDIRECT_SCHEME = "{{ redirect_scheme|escapejs }}";

      let sessionInfo = null;
      let authCode = null;
      let redirected = false;

      const statusEl = document.getElementById("status");
      const btn = document.getElementById("connectBtn");

      function setStatus(text, isError) {
        statusEl.textContent = text || "";
        statusEl.className = "status" + (isError ? " error" : "");
      }

      function finishIfReady() {
        if (redirected) return;
        if (!authCode || !sessionInfo) return;
        const wabaId = sessionInfo.waba_id || sessionInfo.wabaId || "";
        const phoneNumberId =
          sessionInfo.phone_number_id || sessionInfo.phoneNumberId || "";
        if (!wabaId || !phoneNumberId) {
          setStatus("Signup incomplete: missing WABA or phone number id.", true);
          btn.disabled = false;
          return;
        }
        redirected = true;
        const params = new URLSearchParams({
          code: authCode,
          waba_id: String(wabaId),
          phone_number_id: String(phoneNumberId),
          state: STATE,
        });
        setStatus("Returning to the doctor app…");
        window.location.href = REDIRECT_SCHEME + "?" + params.toString();
      }

      window.addEventListener("message", function (event) {
        if (
          typeof event.origin !== "string" ||
          !event.origin.includes("facebook.com")
        ) {
          return;
        }
        try {
          const data =
            typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (!data || data.type !== "WA_EMBEDDED_SIGNUP") return;
          if (data.event === "FINISH" || data.event === "FINISH_ONLY_WABA") {
            sessionInfo = data.data || {};
            finishIfReady();
          } else if (data.event === "CANCEL") {
            setStatus("Signup cancelled.", true);
            btn.disabled = false;
          } else if (data.event === "ERROR") {
            setStatus(
              (data.data && (data.data.error_message || data.data.message)) ||
                "Signup failed.",
              true
            );
            btn.disabled = false;
          }
        } catch (err) {
          // ignore non-JSON messages
        }
      });

      window.fbAsyncInit = function () {
        FB.init({
          appId: APP_ID,
          autoLogAppEvents: true,
          xfbml: true,
          version: "v21.0",
        });
      };

      (function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s);
        js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      })(document, "script", "facebook-jssdk");

      btn.addEventListener("click", function () {
        if (typeof FB === "undefined") {
          setStatus("Meta SDK is still loading. Try again in a moment.", true);
          return;
        }
        btn.disabled = true;
        setStatus("Opening Meta WhatsApp signup…");
        FB.login(
          function (response) {
            if (response && response.authResponse && response.authResponse.code) {
              authCode = response.authResponse.code;
              finishIfReady();
            } else {
              setStatus("Meta login was not completed.", true);
              btn.disabled = false;
            }
          },
          {
            config_id: CONFIG_ID,
            response_type: "code",
            override_default_response_type: true,
            extras: {
              setup: {},
              featureType: "",
              sessionInfoVersion: "3",
            },
          }
        );
      });
    </script>
  </body>
</html>
